---
plaf203:
  module: plaf203
  class: Plaf203

  # The feeder's DL_DEVICE_ID. Keep the real value in your untracked apps.yaml.
  serial_number: '00000000000000000'

  # Address and port of the MQTT broker that receives the feeder's redirected
  # Petlibro MQTT traffic. mqtt_port may be written as a number or string.
  mqtt_host: '127.0.0.1'
  mqtt_port: 1883

  # Optional firmware 3.1.48+ startup values. https_addr defaults to mqtt_host,
  # and tutk_p2p_region defaults to REGION_US when omitted.
  https_addr: '127.0.0.1'
  tutk_p2p_region: 'REGION_US'

  # Petlibro-specific filtering. Do not use AppDaemon's reserved log_level key;
  # it does not support the lowercase Petlibro levels or the trace level.
  petlibro_log_level: 'info'
